services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: kubeaudit
      POSTGRES_USER: kubeaudit_user
      POSTGRES_PASSWORD: kubeaudit_password
    volumes:
      - kubeaudit_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubeaudit_user -d kubeaudit"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://kubeaudit_user:kubeaudit_password@db:5432/kubeaudit
      POSTGRES_DB: kubeaudit
      POSTGRES_USER: kubeaudit_user
      POSTGRES_PASSWORD: kubeaudit_password
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      API_PREFIX: /api
      PYTHONUNBUFFERED: "1"
    volumes:
      - /tmp/kubeaudit:/tmp/kubeaudit
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  kubeaudit_postgres_data:
